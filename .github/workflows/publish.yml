name: Publish Cydia repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cydia-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Ensure Debian packaging tools are available
        run: |
          if ! command -v dpkg-scanpackages >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes dpkg-dev
          fi
      - name: Test repository generation
        run: python3 -m unittest discover -s tests -v
      - name: Build catalog and APT indexes
        run: python3 tools/build.py
      - name: Verify generated downloads and indexes
        run: python3 tools/verify.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Cydia repository
        id: deployment
        uses: actions/deploy-pages@v4
